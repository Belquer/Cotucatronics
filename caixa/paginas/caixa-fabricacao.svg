<text class="ts" x="28" y="48" text-anchor="start">Cotas em mm. Datum de cada face = canto INFERIOR-ESQUERDO da face, visto de fora. (x, y) = centro do furo. Paredes 6 mm, tampa 9 mm.</text>
<text class="warn" x="28" y="61" text-anchor="start">⚠ Diâmetros marcados 'confirmar' dependem da peça em mão — furar só depois de medir.</text>
