<text class="warn" x="720" y="354" text-anchor="start">Furos de linha e DPDT: confirmar diâmetros nas peças.</text>
<text class="hd" x="720" y="120" text-anchor="start">Como funciona</text>
<text class="ts" x="720" y="140" text-anchor="start">· Rebaixo de 6 mm com abas laterais de 8 mm: o powerbank entra por cima e</text>
<text class="ts" x="720" y="154" text-anchor="start">  fica preso por uma tira elástica ou mola de chapa.</text>
<text class="ts" x="720" y="168" text-anchor="start">· O display do powerbank fica visível. O calor fica fora da caixa.</text>
<text class="ts" x="720" y="182" text-anchor="start">· Troca em 5 s, sem abrir nada.</text>
<text class="hd" x="720" y="202" text-anchor="start">O preço</text>
<text class="ts" x="720" y="222" text-anchor="start">· O berço é de UM modelo. Escrever no brief: 'powerbank de referência X,</text>
<text class="ts" x="720" y="236" text-anchor="start">  A × B × C mm'. Se sair de linha, redesenha-se o berço, não o instrumento.</text>
<text class="ts" x="720" y="250" text-anchor="start">· Os conectores da face de trás mudam para a direita (cotas acima).</text>
<text class="ts" x="720" y="264" text-anchor="start">· DPDT a 16 mm entre centros: porcas de ø12 ainda cabem.</text>
<text class="hd" x="720" y="284" text-anchor="start">Alternativa</text>
<text class="ts" x="720" y="304" text-anchor="start">Baía interna ao longo da parede de trás: a caixa cresce 30 em profundidade,</text>
<text class="ts" x="720" y="318" text-anchor="start">ganha uma porta, o powerbank some — e o display e o calor ficam dentro.</text>
</svg>