<text class="hd" x="720" y="120" text-anchor="start">Ranhuras dos dentes das paredes</text>
<text class="ts" x="720" y="140" text-anchor="start">Frente e trás: 6 ranhuras 10 × 6 cada, passo 30, a 3 mm da borda.</text>
<text class="ts" x="720" y="154" text-anchor="start">Esquerda e direita: 4 ranhuras 10 × 6, passo 30, a 3 mm da borda.</text>
<text class="ts" x="720" y="168" text-anchor="start">Geometria exata dos dentes: página 5 (gerada do mesmo ficheiro, kerf 0,2).</text>
<text class="hd" x="720" y="188" text-anchor="start">Alturas por zona</text>
<text class="ts" x="720" y="208" text-anchor="start">sob os freeze (frente): ≤ 8 mm livres depois de montado</text>
<text class="ts" x="720" y="222" text-anchor="start">carrier + espaçador 8 + Daisy no soquete 20 = 30 → fica na metade de trás</text>
<text class="ts" x="720" y="236" text-anchor="start">amp com dissipador ~25 → zona alta, direita</text>
<text class="ts" x="720" y="250" text-anchor="start">step-down e ESP32: encaixam no carrier por header — sem furos no fundo</text>
