<text class="ts" x="760" y="338" text-anchor="start">6 blocos 12×12×25 (quadrados brancos), inserto M3,</text>
<text class="ts" x="760" y="352" text-anchor="start">alinhados com os furos da tampa em x = 10 | 100 | 190.</text>
<rect class="z" x="170.8" y="160.0" width="135.2" height="208.0"/>
<text class="tz" x="238.4" y="172.0" text-anchor="middle">PRÉ-AMP</text>
<text class="ts" x="238.4" y="182.0" text-anchor="middle">ilha AGND · junto aos jacks</text>
<rect class="z" x="332.0" y="160.0" width="187.2" height="208.0"/>
<text class="tz" x="425.6" y="172.0" text-anchor="middle">DAISY + PONTE</text>
<text class="ts" x="425.6" y="182.0" text-anchor="middle">zona alta</text>
<rect class="z" x="534.8" y="170.4" width="109.2" height="135.2"/>
<text class="tz" x="589.4" y="182.4" text-anchor="middle">AMP</text>
<text class="ts" x="589.4" y="192.4" text-anchor="middle">dissipador para cima</text>
<path class="d" d="M138 329.0 L170.8 329.0" stroke-width="2"/>
<path class="d" d="M138 199.0 L170.8 199.0" stroke-width="2"/>
<text class="dt" x="152.6" y="256.0" text-anchor="start">in</text>
<path class="d" d="M644.0 212.0 L676.0 212.0" stroke-width="2"/>
<text class="dt" x="684.0" y="206.0" text-anchor="start">exciters</text>
<text class="ts" x="760" y="372" text-anchor="start">Chicote do painel: sai do carrier pela borda de TRÁS</text>
<text class="ts" x="760" y="386" text-anchor="start">e sobe colado à parede até à tampa.</text>
<text class="hd" x="760" y="120" text-anchor="start">Regras de percurso</text>
<text class="ts" x="760" y="140" text-anchor="start">· Cabo dos piezos entra pela esquerda e vai direto ao pré-amp: &lt; 60 mm.</text>
<text class="ts" x="760" y="154" text-anchor="start">· Cabo dos exciters sai do amp pela direita. Nunca cruza o pré-amp.</text>
<text class="ts" x="760" y="168" text-anchor="start">· IDC do painel (26 vias) corre pela parede de trás, longe da esquerda.</text>
<text class="ts" x="760" y="182" text-anchor="start">· Linha para a mesa: do DPDT (parede de trás) ao amp e aos jacks de trás.</text>
<text class="ts" x="760" y="196" text-anchor="start">· Malha do cabo do piezo: só do lado da placa.</text>
<text class="hd" x="760" y="216" text-anchor="start">Alturas úteis (interior)</text>
<text class="ts" x="760" y="236" text-anchor="start">frente (y=0): 40 − 6 fundo − 8 tampa = 26 mm</text>
<text class="ts" x="760" y="250" text-anchor="start">trás (y=120): 70 − 14 = 56 mm</text>
<text class="ts" x="760" y="264" text-anchor="start">a meio (y=60): 41 mm</text>
<text class="hd" x="760" y="284" text-anchor="start">Blocos da tampa</text>
<text class="ts" x="760" y="304" text-anchor="start">Colados com cimento de acrílico ANTES de furar o inserto.</text>
<text class="ts" x="760" y="318" text-anchor="start">Inserto M3 a quente ou roscado; nunca forçar — racha.</text>
</svg>