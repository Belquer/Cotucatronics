<text class="ti" x="28" y="30" text-anchor="start">Página 4 — INTERIOR: blocos da tampa, percursos de cabo, alturas</text>
<text class="ts" x="28" y="48" text-anchor="start">Vista de cima com a tampa retirada. Blocos de acrílico 12 × 12 × 25 colados nos cantos e a meio das paredes longas, com inserto M3 — recebem os 6 parafusos da tampa.</text>
