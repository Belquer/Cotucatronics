<text x="48.0" y="25.6" font-size="17.5" fill="#111">ENERGIA - Cotucatronics carrier rev B</text>
<text x="48.0" y="723.2" font-size="10.5" fill="#111">1  Decoy PD sempre energizado: a negociacao acontece com SW1 desligado. Ligar depois nao renegoceia.</text>
<text x="48.0" y="737.92" font-size="10.5" fill="#111">2  SW1 latching, LED em WIRING A (a jusante do contacto) = indicador de TRILHO VIVO, nao de gesto.</text>
<text x="48.0" y="752.64" font-size="10.5" fill="#111">   Powerbank que nao negoceia fica em 5V, e o LED denuncia em vez de os amps ficarem mudos sem razao.</text>
<text x="48.0" y="767.36" font-size="10.5" fill="#111">3  C1 2200u/35V low-ESR + C2 100n colados no TERMINAL do amp. Medido 31/08: sem banco, o exciter zumbe.</text>
<text x="48.0" y="782.08" font-size="10.5" fill="#111">4  Modulos FORA da placa: decoy PD, step-down, TPA3116 estereo. Todos com terminais de parafuso.</text>
<text x="48.0" y="796.8" font-size="10.5" fill="#111">5  SEM banco na entrada do step-down: tentado em 31/08 e desfeito.</text>
<text x="48.0" y="811.52" font-size="10.5" fill="#111">6  Step-down de saida FIXA, por decisao. Modulo com regime selecionavel poe 24V a um jumper do VIN da Daisy,</text>
<text x="48.0" y="826.24" font-size="10.5" fill="#111">   e numa serie de dezenas uma seleccao que pode estar errada vai estar errada nalguma.</text>
<text x="48.0" y="840.96" font-size="10.5" fill="#111">7  D2 1N5819: sem ele, o USB da ponte realimenta o trilho de 5V inteiro (medido 31/08). Faixa = catodo,</text>
<text x="48.0" y="855.68" font-size="10.5" fill="#111">   virada para a ponte. Cerca de 0,3V de queda; a ponte aceita 4,3-6,0V. Medido: 4,72V no VIN dela.</text>
<text x="48.0" y="870.4" font-size="10.5" fill="#111">8  Orcamento do trilho de 5V: Daisy 300 + ponte 100 (pico 300) + OLED 30 + LEDs 2x30 = ~490 mA de ~1,5A.</text>
<text x="48.0" y="885.12" font-size="10.5" fill="#111">   O resistor de serie dos LEDs, dimensionado para ~30 mA, e o que mantem a folga em 3x.</text>
</svg>