<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="880" viewBox="0 0 1010 880" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1010" height="880" fill="#fff"/>
<style>
