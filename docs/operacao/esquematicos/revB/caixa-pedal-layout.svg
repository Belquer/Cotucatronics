</style>

<text class="ti" x="30" y="30">Cotucatronics — caixa formato pedal · 200 × 120 × 65 mm</text>
<text class="ts" x="30" y="49">Cotas em mm. Furos à escala. O critério de posição não é o espaço — é a separação medida em 01/09.</text>

<!-- ================= VISTA DE TOPO ================= -->
<text class="hd" x="60" y="84">TOPO — 200 × 120</text>

