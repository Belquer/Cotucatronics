<text class="td" x="212" y="372">50</text>
<path class="dim" d="M310 108 L397 108 M310 103 L310 113 M397 103 L397 113"/>
<text class="td" x="345" y="122">35</text>

<!-- ================= TOPO ANOTAÇÕES ================= -->
<text class="ts" x="612" y="120">Nada muda de posição por gosto:</text>
<text class="ts" x="612" y="140">· piezos entram pela ESQUERDA, exciters saem</text>
<text class="ts" x="612" y="154">  pela DIREITA — os dois cabos nunca correm</text>
<text class="ts" x="612" y="168">  juntos, que é o item 1 da bancada.</text>
<text class="ts" x="612" y="188">· o carrier fica na metade esquerda, com o</text>
<text class="ts" x="612" y="202">  pré-amp encostado aos jacks de entrada.</text>
<text class="ts" x="612" y="222">· o módulo do amp fica na metade direita,</text>
<text class="ts" x="612" y="236">  aparafusado à parede da caixa (dissipador).</text>
<text class="ts" x="612" y="256">· os cinco fios do OLED atravessam por CIMA,</text>
<text class="ts" x="612" y="270">  colados ao painel, longe do fundo.</text>
<text class="ts" x="612" y="290">· pots e encoder à direita: mão direita manda,</text>
<text class="ts" x="612" y="304">  e afasta o cabo analógico da entrada.</text>
<text class="ts" x="612" y="330">Arcade a 50 mm de eixo: dá para carregar com</text>
<text class="ts" x="612" y="344">o pé sem apanhar os dois.</text>

<!-- ================= TOPA A ================= -->
<text class="hd" x="60" y="490">TOPO A — ENTRADA · 120 × 65</text>
<rect class="box" x="60" y="502" width="300" height="162"/>
<circle class="hf" cx="147" cy="583" r="11.9"/>
<text class="t" x="112" y="622">piezo A</text>
<circle class="hf" cx="272" cy="583" r="11.9"/>
<text class="t" x="237" y="622">piezo B</text>
<text class="ts" x="112" y="640">TRS 1/4" · anel ao AGND = blindagem</text>
<path class="dim" d="M60 678 L360 678 M60 673 L60 683 M360 673 L360 683"/>
<text class="td" x="200" y="694">120</text>
<path class="dim" d="M374 502 L374 664 M369 502 L379 502 M369 664 L379 664"/>
<text class="td" x="382" y="588">65</text>

<!-- ================= TOPA B ================= -->
<text class="hd" x="450" y="490">TOPO B — SAÍDA E CONFIGURAÇÃO · 120 × 65</text>
<rect class="box" x="450" y="502" width="300" height="162"/>
<rect class="hf" x="478" y="545" width="30" height="16"/>
<text class="t" x="470" y="578">USB-C</text>
<circle class="hf" cx="562" cy="553" r="11.9"/>
<text class="t" x="540" y="578">linha L</text>
<circle class="hf" cx="627" cy="553" r="11.9"/>
<text class="t" x="605" y="578">linha R</text>
<rect class="hf" x="672" y="540" width="52" height="26"/>
<text class="t" x="676" y="578">exciters</text>
<circle class="hf" cx="500" cy="620" r="7.5"/>
<circle class="hf" cx="545" cy="620" r="7.5"/>
<text class="t" x="562" y="624">DPDT ×2 — amp | ambos | jack</text>
<text class="ts" x="470" y="648">config de montagem, não de performance: fica atrás</text>

<!-- rodapé -->
<path d="M30 720 L980 720" stroke="#ccc" stroke-width="1"/>
<text class="hd" x="30" y="746">Três medições que faltam antes de furar</text>
<text class="t" x="30" y="770">1 · PROFUNDIDADE do botão de energia. A ficha diz 3,9" (99 mm) — se for o corpo e não o rabicho, ele sozinho decide a altura da caixa.</text>
<text class="t" x="30" y="792">2 · PROFUNDIDADE dos arcade de 30 mm com o conector encaixado. Somada à espessura do carrier, é o que valida os 65 mm.</text>
<text class="t" x="30" y="814">3 · MÓDULO DO AMP: medidas, furos e se tem trimpots de entrada. Se tiver, substituem os pots do painel na função de ganho.</text>
<text class="ts" x="30" y="842">Térmico: o TPA3116 arrefece por convecção. Caixa fechada, meses ligada numa galeria — o módulo aparafusa-se à parede da direita,</text>
<text class="ts" x="30" y="858">que passa a ser dissipador, e a tampa leva furos de ventilação por cima dele. Sem isso, os 65 mm não são altura, são estufa.</text>
</svg>
