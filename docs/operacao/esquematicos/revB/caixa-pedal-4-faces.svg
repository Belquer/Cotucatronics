<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="900" viewBox="0 0 1010 900" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1010" height="760" fill="#fff"/>
<style>
 .box{fill:#fafafa;stroke:#111;stroke-width:2}
 .h{fill:none;stroke:#b8322c;stroke-width:1.8}
 .hf{fill:#fdeceb;stroke:#b8322c;stroke-width:1.8}
 .dim{stroke:#3a6ea5;stroke-width:1;fill:none}
 .t{font-size:11px;fill:#111}
 .ts{font-size:9.5px;fill:#666}
 .td{font-size:10px;fill:#3a6ea5}
 .hd{font-size:13px;fill:#111;font-weight:bold}
 .ti{font-size:17px;fill:#111;font-weight:bold}
 .zn{font-size:10px;fill:#8a6200}
</style>

<text class="ti" x="30" y="30">Cotucatronics — pedal · 200 × 120 × 65 mm · quatro faces</text>
<text class="ts" x="30" y="49">Escultura entra pela esquerda e sai pela direita — os dois cabos nunca correm juntos. O mundo (energia, mesa, configuração) fica atrás.</text>

<!-- ================= TOPO ================= -->
<text class="hd" x="60" y="84">TOPO — performance</text>
<rect class="box" x="60" y="96" width="500" height="300"/>
<rect x="61" y="97" width="150" height="298" fill="#3a8a3a" opacity="0.08"/>
<rect x="409" y="97" width="150" height="298" fill="#d09000" opacity="0.10"/>
<text class="zn" x="70" y="388" fill="#2c6e2c">pré-amp por baixo</text>
<text class="zn" x="440" y="388">amp por baixo</text>

<rect class="hf" x="97.5" y="126" width="137.5" height="69"/>
<text class="t" x="103" y="152">OLED 2,42"</text>
<text class="ts" x="103" y="167">janela 55 × 27,5</text>

<circle class="hf" cx="310" cy="158" r="25"/><circle class="h" cx="310" cy="158" r="8.75"/>
<text class="t" x="288" y="203">encoder</text>
<circle class="hf" cx="397" cy="158" r="25"/><circle class="h" cx="397" cy="158" r="8.75"/>
<text class="t" x="381" y="203">pot L</text>
<circle class="hf" cx="485" cy="158" r="25"/><circle class="h" cx="485" cy="158" r="8.75"/>
<text class="t" x="469" y="203">pot R</text>

<circle class="hf" cx="185" cy="296" r="41.25"/><circle class="h" cx="185" cy="296" r="37.5"/>
<text class="t" x="154" y="300">freeze A</text><text class="ts" x="165" y="315">azul 30</text>
<circle class="hf" cx="435" cy="296" r="41.25"/><circle class="h" cx="435" cy="296" r="37.5"/>
<text class="t" x="404" y="300">freeze B</text><text class="ts" x="415" y="315">azul 30</text>

<path class="dim" d="M60 410 L560 410 M60 405 L60 415 M560 405 L560 415"/>
<text class="td" x="298" y="426">200</text>
<path class="dim" d="M574 96 L574 396 M569 96 L579 96 M569 396 L579 396"/>
<text class="td" x="582" y="250">120</text>

<text class="ts" x="612" y="120">Os dois freeze a 100 mm de eixo:</text>
<text class="ts" x="612" y="134">um por pé, sem apanhar o outro.</text>
<text class="ts" x="612" y="158">Pots e encoder do lado do amp,</text>
<text class="ts" x="612" y="172">longe do pré-amp: o cabo analógico</text>
<text class="ts" x="612" y="186">dos pots não passa pela entrada.</text>
<text class="ts" x="612" y="210">Os cinco fios do OLED atravessam</text>
<text class="ts" x="612" y="224">colados ao painel de cima.</text>
<text class="ts" x="612" y="248">Botão de energia atrás: não é</text>
<text class="ts" x="612" y="262">gesto de performance.</text>

<!-- ================= ESQUERDA ================= -->
<text class="hd" x="60" y="470">ESQUERDA — piezos IN · 120 × 65</text>
<rect class="box" x="60" y="482" width="300" height="162"/>
<circle class="hf" cx="147" cy="563" r="11.9"/><text class="t" x="118" y="602">piezo A</text>
<circle class="hf" cx="272" cy="563" r="11.9"/><text class="t" x="243" y="602">piezo B</text>
<text class="ts" x="90" y="622">TRS ¼" · ring + sleeve ao AGND</text>
<path class="dim" d="M60 658 L360 658 M60 653 L60 663 M360 653 L360 663"/>
<text class="td" x="200" y="674">120</text>
<path class="dim" d="M374 482 L374 644 M369 482 L379 482 M369 644 L379 644"/>
<text class="td" x="382" y="568">65</text>

<!-- ================= DIREITA ================= -->
<text class="hd" x="450" y="470">DIREITA — exciters OUT · 120 × 65</text>
<rect class="box" x="450" y="482" width="300" height="162"/>
<rect class="hf" x="500" y="545" width="60" height="30"/><text class="t" x="504" y="595">exciter A</text>
<rect class="hf" x="640" y="545" width="60" height="30"/><text class="t" x="644" y="595">exciter B</text>
<text class="ts" x="470" y="622">bornes 2 polos · BTL: os dois quentes, nunca a terra</text>

<!-- ================= TRÁS ================= -->
<text class="hd" x="60" y="700">TRÁS — mundo · 200 × 65</text>
<rect class="box" x="60" y="712" width="500" height="162"/>
<rect class="hf" x="88" y="783" width="30" height="16"/><text class="t" x="80" y="822">USB-C PD</text>
<circle class="hf" cx="175" cy="791" r="12"/><text class="t" x="150" y="822">energia 19</text>
<circle class="hf" cx="260" cy="791" r="11.9"/><text class="t" x="240" y="822">linha L</text>
<circle class="hf" cx="325" cy="791" r="11.9"/><text class="t" x="305" y="822">linha R</text>
<circle class="hf" cx="440" cy="791" r="7.5"/><circle class="hf" cx="490" cy="791" r="7.5"/>
<text class="t" x="418" y="822">DPDT ×2</text>
<text class="ts" x="80" y="850">energia e mesa do mesmo lado: o cabo USB e o cabo da mesa saem juntos, longe da escultura</text>
<text class="ts" x="612" y="760">TRS de linha para a direct box ou mesa.</text>
<text class="ts" x="612" y="774">DPDT atrás: amp | ambos | jack é</text>
<text class="ts" x="612" y="788">configuração de montagem, não performance.</text>
<text class="ts" x="612" y="812">Botão de energia com LED em wiring A:</text>
<text class="ts" x="612" y="826">acende só com 15 V no trilho.</text>
</svg>
