  <circle class="node" cx="310" cy="1458" r="3.5"/>

  <rect class="comp" x="620" y="1250" width="200" height="230" rx="6"/>
  <text class="lblb" x="640" y="1275">OLED 2.42" (7 pinos)</text>
  <line x1="620" y1="1285" x2="820" y2="1285" stroke="#d8d3c8"/>
  <circle class="node" cx="620" cy="1308" r="3.5"/>
  <text class="pin" x="640" y="1313">VCC</text>
  <circle class="node" cx="620" cy="1338" r="3.5"/>
  <text class="pin" x="640" y="1343">GND</text>
  <circle class="node" cx="620" cy="1368" r="3.5"/>
  <text class="pin" x="640" y="1373">SCL / SCK</text>
  <circle class="node" cx="620" cy="1398" r="3.5"/>
  <text class="pin" x="640" y="1403">SDA / MOSI</text>
  <circle class="node" cx="620" cy="1428" r="3.5"/>
  <text class="pin" x="640" y="1433">CS</text>
  <circle class="node" cx="620" cy="1458" r="3.5"/>
  <text class="pin" x="640" y="1463">DC · RES</text>

  <line class="w5" x1="310" y1="1308" x2="620" y2="1308"/>
  <line class="wg" x1="310" y1="1338" x2="620" y2="1338"/>
  <line class="wd" x1="310" y1="1368" x2="620" y2="1368"/>
  <line class="wd" x1="310" y1="1398" x2="620" y2="1398"/>
  <line class="wd" x1="310" y1="1428" x2="620" y2="1428"/>
  <line class="wd" x1="310" y1="1458" x2="620" y2="1458"/>

  <text class="red" x="850" y="1313">3,3V</text>
  <text class="note" x="850" y="1373">clock</text>
  <text class="note" x="850" y="1403">dados</text>
  <text class="note" x="850" y="1433">chip select</text>
  <text class="note" x="850" y="1463">cmd + reset</text>

  <text class="red" x="120" y="1508">Os D-números exatos do periférico SPI: CONFIRMAR na libDaisy antes de soldar (fonte, não memória).</text>
  <text class="note" x="120" y="1526">Não colide com os ocupados: D13/D14 (UART) · D15–D19 (pots) · D26/D27 (botões) · D28 (LB). D29/D30 livres.</text>
  <text class="note" x="120" y="1544">Recorte do painel: área visível 55,01 × 27,49mm · módulo 61,50 × 39,50mm · conector MX1.25 de 7 pinos.</text>

  <!-- ============ NOTAS ============ -->
  <rect class="card" x="40" y="1580" width="920" height="350" rx="8"/>
  <text class="h" x="60" y="1608">NOTAS — o que mudou desde a v2</text>

  <text class="lblb" x="70" y="1642">ATENUADOR: fora do plano (por ora)</text>
  <text class="lbl" x="80" y="1662">O clip medido veio de dedo direto no disco solto — regime que não é o de uso. Na escultura o piezo lê flexão de</text>
  <text class="lbl" x="80" y="1680">placa, nível bem mais baixo. Monta só a proteção, toca normal, `hist` remede. Atenuador só se clipar tocando.</text>

  <text class="lblb" x="70" y="1712">LG/LR: removidos (medido, 20/08)</text>
  <text class="lbl" x="80" y="1732">Não marcavam estado útil. Só o LB (D28) permanece. D29 e D30 voltaram ao pool de pinos livres.</text>

  <text class="lblb" x="70" y="1764">DUAS CADEIAS: in_gain e gate por canal</text>
  <text class="lbl" x="80" y="1784">Justificativa é MATERIAL, não desequilíbrio — A e B chegam iguais (o p2 baixo era defeito físico do piezo, trocar</text>
  <text class="lbl" x="80" y="1802">os piezos de canal provou). Tambor e mola pedem limiares diferentes mesmo com transdutores idênticos.</text>

  <text class="lblb" x="70" y="1834">ENERGIA (inalterada)</text>
  <text class="lbl" x="80" y="1854">INIU 45W → 1 porta USB-C → conector chassi → PD trigger 12V → switch (no +V) → rail 12V → amp</text>
  <text class="lbl" x="80" y="1872">                                                                              └→ step-down 12→5V → Daisy VIN + WIDI VI</text>
  <text class="red" x="80" y="1896">Capacitor 2200µF/25V colado no amp é obrigatório. Uma porta só do powerbank (duas fazem renegociar pra 5V/15W).</text>

  <text class="note" x="60" y="1962">Cotucatronics OS · esquemáticos v3 · pinos de UART/GPIO verificados no fonte · pinos de SPI a confirmar na libDaisy</text>
</svg>
