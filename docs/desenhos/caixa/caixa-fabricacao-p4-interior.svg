<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="640" fill="#fff"/>
<style>
 .box{fill:#fafafa;stroke:#111;stroke-width:1.8}
 .h{fill:#fdeceb;stroke:#b8322c;stroke-width:1.4}
