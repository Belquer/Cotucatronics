<text class="hd" x="620" y="120" text-anchor="start">Notas</text>
<text class="ts" x="620" y="140" text-anchor="start">· Furos de knobs a 92 mm da frente, no plano da tampa.</text>
<text class="ts" x="620" y="154" text-anchor="start">· Freeze a 35 mm da frente: o pé chega sem tocar nos knobs (26 mm livres).</text>
<text class="ts" x="620" y="168" text-anchor="start">· Escareado dos M3: 90°, ø6,5 na face — a cabeça fica rente.</text>
<text class="ts" x="620" y="182" text-anchor="start">· Bordas da tampa SEM dentes: assenta a topo nas paredes.</text>
<text class="ts" x="620" y="196" text-anchor="start">· Furos em acrílico: broca própria ou laser; nunca broca de metal a alta rotação.</text>
<text class="hd" x="620" y="216" text-anchor="start">Folgas medidas</text>
<text class="ts" x="620" y="236" text-anchor="start">encoder ø18 → pot L ø13: 19,5 mm · pot L → pot R: 22 · pot R → borda: 18,5</text>
<text class="ts" x="620" y="250" text-anchor="start">encoder → janela OLED: 23,5 · knobs → freeze: 33</text>
