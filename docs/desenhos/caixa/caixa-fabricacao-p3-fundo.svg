</style>
<text class="ti" x="28" y="30" text-anchor="start">Página 3 — FUNDO (acrílico cast 6 mm) · 200 × 120</text>
<text class="ts" x="28" y="48" text-anchor="start">Datum = canto esquerdo-frente visto de CIMA (de dentro da caixa). Paredes assentam por cima; dentes das paredes entram em ranhuras no fundo.</text>
<rect class="box" x="60" y="148.0" width="520.0" height="312.0"/>
<text class="hd" x="60" y="140.0" text-anchor="start">vista de cima, de dentro</text>
<path class="d" d="M60 476 L580.0 476 M60 472 L60 480 M580.0 472 L580.0 480"/>
<text class="dt" x="320.0" y="490" text-anchor="middle">200</text>
<path class="d" d="M592.0 148.0 L592.0 460 M588.0 148.0 L596.0 148.0 M588.0 460 L596.0 460"/>
<text class="dt" x="598.0" y="307.0" text-anchor="start">120</text>
<rect class="hc" x="75.6" y="163.60000000000002" width="488.8" height="280.8" stroke-dasharray="6 3"/>
<text class="ts" x="320.0" y="155.8" text-anchor="middle">interior 188 × 108 (linha das paredes)</text>
<rect class="z" x="117.2" y="174.0" width="312.0" height="260.0"/>
<text class="tz" x="273.2" y="186.0" text-anchor="middle">CARRIER 120 × 100</text>
<text class="ts" x="273.2" y="196.0" text-anchor="middle">4 espaçadores M3 × 8 mm</text>
<circle class="h" cx="126.3" cy="424.9" r="4.16"/>
<circle class="h" cx="420.1" cy="424.9" r="4.16"/>
<circle class="h" cx="126.3" cy="183.10000000000002" r="4.16"/>
<circle class="h" cx="420.1" cy="183.10000000000002" r="4.16"/>
<text class="warn" x="273.2" y="309.2" text-anchor="middle">4× ø3,2 — padrão do carrier, CONFIRMAR</text>
<rect class="z" x="444.8" y="210.4" width="109.2" height="135.2"/>
<text class="tz" x="499.4" y="222.4" text-anchor="middle">AMP</text>
<rect class="h" x="452.6" y="326.1" width="93.6" height="7.8"/>
<rect class="h" x="452.6" y="305.3" width="93.6" height="7.8"/>
<rect class="h" x="452.6" y="284.5" width="93.6" height="7.8"/>
<rect class="h" x="452.6" y="263.7" width="93.6" height="7.8"/>
<rect class="h" x="452.6" y="242.9" width="93.6" height="7.8"/>
<text class="ts" x="620" y="300" text-anchor="start">Ventilação sob o amp: 5 rasgos 36 × 3, passo 8, de y=50 a 82.</text>
<circle class="hc" cx="91.2" cy="428.8" r="19.5" stroke-dasharray="3 2"/>
<circle class="hc" cx="548.8" cy="428.8" r="19.5" stroke-dasharray="3 2"/>
<circle class="hc" cx="91.2" cy="179.2" r="19.5" stroke-dasharray="3 2"/>
<circle class="hc" cx="548.8" cy="179.2" r="19.5" stroke-dasharray="3 2"/>
<text class="ts" x="620" y="314" text-anchor="start">Pés: 4× ø15 adesivos a 12 mm dos cantos (tracejado). Sem furos.</text>
<rect class="z" x="450.0" y="163.60000000000002" width="67.6" height="36.4"/>
<text class="tz" x="483.8" y="175.60000000000002" text-anchor="middle">DECOY</text>
<path class="d" d="M126.3 500 L420.1 500 M126.3 496 L126.3 504 M420.1 496 L420.1 504"/>
<text class="dt" x="273.2" y="493" text-anchor="middle">113</text>
<path class="d" d="M38 183.10000000000002 L38 424.9 M34 183.10000000000002 L42 183.10000000000002 M34 424.9 L42 424.9"/>
<text class="dt" x="32" y="307.0" text-anchor="end">93</text>
<text class="hd" x="620" y="120" text-anchor="start">Ranhuras dos dentes das paredes</text>
<text class="ts" x="620" y="140" text-anchor="start">Frente e trás: 6 ranhuras 10 × 6 cada, passo 30, a 3 mm da borda.</text>
<text class="ts" x="620" y="154" text-anchor="start">Esquerda e direita: 4 ranhuras 10 × 6, passo 30, a 3 mm da borda.</text>
<text class="ts" x="620" y="168" text-anchor="start">Geometria exata dos dentes: página 5 (gerada do mesmo ficheiro, kerf 0,2).</text>
<text class="hd" x="620" y="188" text-anchor="start">Alturas por zona</text>
<text class="ts" x="620" y="208" text-anchor="start">sob os freeze (frente): ≤ 8 mm livres depois de montado</text>
<text class="ts" x="620" y="222" text-anchor="start">carrier + espaçador 8 + Daisy no soquete 20 = 30 → fica na metade de trás</text>
<text class="ts" x="620" y="236" text-anchor="start">amp com dissipador ~25 → zona alta, direita</text>
<text class="ts" x="620" y="250" text-anchor="start">step-down e ESP32: encaixam no carrier por header — sem furos no fundo</text>
</svg>